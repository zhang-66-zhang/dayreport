<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行政前台日报 / 周报填写工具</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1f2733; --sub:#5b6675;
    --line:#e3e8ef; --accent:#2f6df0; --accent-soft:#eaf1ff;
    --green:#1f9d6b; --red:#e0483b; --warn:#c8851a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
    font-size:14px;line-height:1.6;}
  .wrap{max-width:920px;margin:0 auto;padding:18px 16px 60px;}
  h1{font-size:20px;margin:6px 0 2px;}
  .tip{color:var(--sub);font-size:12.5px;margin-bottom:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,30,50,.04);}
  .card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .card h2 .num{background:var(--accent);color:#fff;border-radius:6px;
    width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;}
  label{display:block;font-size:12.5px;color:var(--sub);margin:10px 0 4px;}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:42px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .row .grow{flex:1;}
  .pwd-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;}
  .dt-row{display:flex;gap:8px;align-items:center;}
  .dt-row > *{flex:1;min-width:0;}
  .time-pick{display:flex;align-items:center;gap:4px;}
  .time-pick select{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#fff;color:var(--ink);font-family:inherit;}
  .time-pick span{color:var(--sub);font-weight:500;}
  button{cursor:pointer;border:none;border-radius:8px;padding:9px 14px;font-size:13px;
    font-family:inherit;transition:.15s;font-weight:500;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#2257d6;}
  .btn-ghost{background:var(--accent-soft);color:var(--accent);}
  .btn-ghost:hover{background:#dde9ff;}
  .btn-line{background:#fff;color:var(--sub);border:1px solid var(--line);}
  .btn-line:hover{border-color:var(--accent);color:var(--accent);}
  .btn-sm{padding:5px 9px;font-size:12px;border-radius:6px;}
  .btn-del{background:#fdeceb;color:var(--red);}
  .btn-del:hover{background:#fbd9d6;}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .pill{display:inline-block;background:var(--accent-soft);color:var(--accent);
    border-radius:20px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0;}
  .saved-dates{margin-top:8px;}
  pre.out{background:#0f1726;color:#e6edf7;padding:14px 16px;border-radius:10px;
    white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.65;
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;max-height:520px;overflow:auto;}
  .sec-title{font-weight:600;margin:14px 0 4px;color:var(--ink);font-size:13.5px;}
  .muted{color:var(--sub);font-size:12px;}
  .week-nav{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .week-nav b{font-size:13.5px;}
  .hidden{display:none;}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);
    background:#1f2733;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;
    opacity:0;transition:.25s;pointer-events:none;z-index:99;}
  .toast.show{opacity:1;}
  .footer{color:var(--sub);font-size:12px;text-align:center;margin-top:24px;}
  .tag{font-size:11px;color:var(--warn);background:#fff4e3;border-radius:5px;padding:1px 6px;margin-left:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>行政前台 · 日报 / 周报填写工具</h1>
  <div class="tip">数据仅保存在本机浏览器（localStorage），不上传、不联网。每天填一次「日报」，到周末一键汇总「周报」。<span class="tag">离线可用</span></div>

  <!-- 工具栏 -->
  <div class="toolbar">
    <button class="btn-primary" onclick="genDailyPreview()">生成今日日报</button>
    <button class="btn-ghost" onclick="copyDaily()">复制日报</button>
    <button class="btn-line" onclick="saveToday()">保存今日</button>
    <button class="btn-line" onclick="loadToday()">载入今日</button>
    <button class="btn-line" onclick="clearForm()">清空表单</button>
    <button class="btn-ghost" onclick="toggleWeek()">查看本周周报 ▾</button>
  </div>

  <!-- 基础信息 -->
  <div class="card">
    <h2><span class="num">📅</span>日期</h2>
    <div class="grid">
      <div><label>填报日期</label><input id="rdate" type="date"></div>
    </div>
  </div>

  <!-- 公共区域管理 -->
  <div class="card">
    <h2><span class="num">1</span>公共区域管理</h2>

    <div class="sec-title">会议室密码（本周期，填一次即可，每天自动带入）</div>
    <div class="pwd-grid">
      <div><label>中会议室密码</label><input id="p_zhong" type="text" placeholder="如 011199#"></div>
      <div><label>茶室密码</label><input id="p_cha" type="text" placeholder="如 555110#"></div>
      <div><label>VIP接待室密码</label><input id="p_vip" type="text" placeholder="如 710026#"></div>
      <div><label>密码有效期</label>
        <div class="dt-row"><input id="p_date" type="date"><div class="time-pick"><select id="p_hour"></select><span>:</span><select id="p_min"></select></div></div>
      </div>
    </div>
    <div style="margin-top:10px;"><button class="btn-line btn-sm" onclick="savePwd()">保存本周期密码</button>
      <span id="pwd_state" class="muted"></span></div>

    <div class="sec-title">客户接待统计</div>
    <div class="grid">
      <div><label>16层公共区域接待组数（北+南 自动合计）</label><input id="c16" type="number" min="0" value="0" readonly></div>
      <div><label>21层公共区域接待组数（其余区域 自动合计）</label><input id="c21" type="number" min="0" value="0" readonly></div>
    </div>
    <div class="sec-title">各会议室 / 区域使用组数</div>
    <div class="grid">
      <div><label>小会议室（北）</label><input id="r_north" type="number" min="0" value="0" oninput="recalcTotals()"></div>
      <div><label>小会议室（南）</label><input id="r_south" type="number" min="0" value="0" oninput="recalcTotals()"></div>
      <div><label>中会议室</label><input id="r_mid" type="number" min="0" value="0" oninput="recalcTotals()"></div>
      <div><label>大会议室</label><input id="r_big" type="number" min="0" value="0" oninput="recalcTotals()"></div>
      <div><label>路演厅</label><input id="r_road" type="number" min="0" value="0" oninput="recalcTotals()"></div>
      <div><label>接待室</label><input id="r_recv" type="number" min="0" value="0" oninput="recalcTotals()"></div>
      <div><label>茶室</label><input id="r_tea" type="number" min="0" value="0" oninput="recalcTotals()"></div>
    </div>

    <div class="sec-title">公共区域单日使用单次超 4 小时</div>
    <div id="over4_list"></div>
    <button class="btn-line btn-sm" onclick="addOver4()">+ 添加一条</button>

    <div class="sec-title">公共区域投屏使用时间</div>
    <input id="proj" type="text" placeholder="如：无 / 14:00-15:30 中会议室">
  </div>

  <!-- 客户服务事项 -->
  <div class="card">
    <h2><span class="num">2</span>客户服务事项</h2>
    <div id="svc_list"></div>
    <button class="btn-line btn-sm" onclick="addSvc()">+ 添加一条事项</button>
  </div>

  <!-- 日报预览 -->
  <div class="card" id="preview_card">
    <h2><span class="num">📄</span>日报预览</h2>
    <pre class="out" id="daily_out">（填写后点击「生成今日日报」）</pre>
    <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn-ghost btn-sm" onclick="copyDaily()">复制日报</button>
      <button class="btn-line btn-sm" onclick="downloadDaily()">下载 .txt</button>
    </div>
  </div>

  <!-- 周报 -->
  <div class="card hidden" id="week_card">
    <h2><span class="num">🗓️</span>本周周报（周一至周日）</h2>
    <div class="week-nav">
      <button class="btn-line btn-sm" onclick="shiftWeek(-1)">← 上一周</button>
      <b id="week_range"></b>
      <button class="btn-line btn-sm" onclick="shiftWeek(1)">下一周 →</button>
      <button class="btn-ghost btn-sm" onclick="genWeek()">生成周报</button>
      <button class="btn-line btn-sm" onclick="copyWeek()">复制周报</button>
      <button class="btn-line btn-sm" onclick="downloadWeek()">下载 .txt</button>
    </div>
    <pre class="out" id="week_out">（点击「生成周报」汇总本周已保存的日报）</pre>
    <div class="saved-dates" id="week_dates"></div>
  </div>

  <div class="footer">提示：换电脑或清浏览器缓存会丢失数据，重要周报请及时「下载 .txt」或复制留存。</div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORE_KEY='frontdesk_reports_v1';
const PWD_KEY='frontdesk_passwords_v1';
let weekOffset=0;

function $(id){return document.getElementById(id);}
function loadReports(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{};}catch(e){return {};}}
function saveReports(o){localStorage.setItem(STORE_KEY,JSON.stringify(o));}
function loadPwd(){try{return JSON.parse(localStorage.getItem(PWD_KEY))||null;}catch(e){return null;}}
function savePwdStore(o){localStorage.setItem(PWD_KEY,JSON.stringify(o));}
function todayStr(){const d=new Date();return d.toISOString().slice(0,10);}
function wdCN(d){return ['日','一','二','三','四','五','六'][new Date(d).getDay()];}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);}
function fmtValid(v){if(!v)return '';const p=v.split('T');if(p.length<2)return v;
  const [y,m,dd]=p[0].split('-');return `${y}年${m}月${dd}日 ${p[1]}`;}
function recalcTotals(){const sum=(...ids)=>ids.reduce((a,id)=>a+(+$(id).value||0),0);
  $('c16').value=sum('r_north','r_south');
  $('c21').value=sum('r_mid','r_big','r_road','r_recv','r_tea');}

/* ---------- 密码 ---------- */
function fillPwd(){const p=loadPwd();if(!p)return;
  $('p_zhong').value=p.zhong||'';$('p_cha').value=p.cha||'';
  $('p_vip').value=p.vip||'';
  if(p.valid){const [d,t]=p.valid.split('T');$('p_date').value=d||'';const [h,m]=(t||'20:00').split(':');$('p_hour').value=h||'20';$('p_min').value=m||'00';}
  else{$('p_date').value='';$('p_hour').value='20';$('p_min').value='00';}
  $('pwd_state').textContent='（已保存，可修改后重新保存）';}
function savePwd(){const d=$('p_date').value,h=$('p_hour').value,m=$('p_min').value;
  const t=(h&&m)?`${h}:${m}`:'20:00';
  const valid=d?`${d}T${t}`:'';
  const p={zhong:$('p_zhong').value.trim(),cha:$('p_cha').value.trim(),
    vip:$('p_vip').value.trim(),valid:valid};
  savePwdStore(p);$('pwd_state').textContent='（已保存 ✓）';toast('本周期密码已保存');}

/* ---------- 动态列表 ---------- */
function addOver4(val){const wrap=$('over4_list');const row=document.createElement('div');
  row.className='row';row.innerHTML=`<input class="grow" type="text" placeholder="如：38-E 预约使用小会议室（北）9小时" value="${val||''}">
    <button class="btn-del btn-sm" onclick="this.parentNode.remove()">删除</button>`;
  wrap.appendChild(row);}
function addSvc(val){const wrap=$('svc_list');const row=document.createElement('div');
  row.className='row';row.innerHTML=`<input class="grow" type="text" placeholder="填写一项客户服务事项" value="${val||''}">
    <button class="btn-del btn-sm" onclick="this.parentNode.remove()">删除</button>`;
  wrap.appendChild(row);}

/* ---------- 收集表单 ---------- */
function collect(){
  const over4=[...document.querySelectorAll('#over4_list input')].map(i=>i.value.trim()).filter(Boolean);
  const svc=[...document.querySelectorAll('#svc_list input')].map(i=>i.value.trim()).filter(Boolean);
  return{
    date:$('rdate').value||todayStr(),
    pwd:loadPwd(),
    c16:(+$('r_north').value||0)+(+$('r_south').value||0),
    c21:(+$('r_mid').value||0)+(+$('r_big').value||0)+(+$('r_road').value||0)+(+$('r_recv').value||0)+(+$('r_tea').value||0),
    r_north:$('r_north').value||0,r_south:$('r_south').value||0,r_mid:$('r_mid').value||0,
    r_big:$('r_big').value||0,r_road:$('r_road').value||0,r_recv:$('r_recv').value||0,r_tea:$('r_tea').value||0,
    over4,proj:$('proj').value.trim()||'无',svc
  };
}

/* ---------- 生成日报文字 ---------- */
function genDailyText(d){
  const wd=wdCN(d.date);
  const[y,m,day]=d.date.split('-');
  let s=`${y}年${m}月${day}日 星期${wd} 行政前台事项\n\n`;
  s+=`公共区域管理：\n\n`;
  if(d.pwd){
    s+=`1、会议室密码：\n中会议室密码：${d.pwd.zhong} \n茶室密码：${d.pwd.cha} \nVIP接待室密码：${d.pwd.vip} \n\n密码有效期至${fmtValid(d.pwd.valid)}\n\n`;
  }else{
    s+=`1、会议室密码：\n（未设置本周期密码，请在表单填写并保存）\n\n`;
  }
  s+=`2、16层公共区域共接${d.c16}组客户，21层公共区域共接待${d.c21}组客户 。\n`;
  s+=`小会议室（北）：${d.r_north}组 \n小会议室（南）：${d.r_south}组 \n中会议室：${d.r_mid}组 \n大会议室：${d.r_big}组 \n路演厅：${d.r_road}组 \n接待室：${d.r_recv}组 \n茶室：${d.r_tea}组 \n\n`;
  s+=`3、公共区域单日使用单次超4小时：\n`;
  s+= d.over4.length? d.over4.map(x=>x+'。').join('\n')+'\n' : '无\n';
  s+=`\n4、公共区域投屏使用时间：\n${d.proj}\n\n`;
  s+=`客户服务事项：\n\n`;
  if(d.svc.length) s+= d.svc.map((x,i)=>`${i+1}、${x}`).join('\n');
  else s+='（无）';
  return s;
}

let lastDaily='';
function genDailyPreview(){const d=collect();lastDaily=genDailyText(d);$('daily_out').textContent=lastDaily;
  $('daily_out').scrollIntoView({behavior:'smooth',block:'nearest'});}

function copyDaily(){if(!lastDaily){genDailyPreview();}
  navigator.clipboard.writeText(lastDaily).then(()=>toast('日报已复制 ✓')).catch(()=>toast('复制失败，请手动选择'));}

function downloadDaily(){if(!lastDaily)genDailyPreview();
  const d=collect();const[y,m,day]=d.date.split('-');
  downloadFile(`${y}${m}${day}_行政前台日报.txt`,lastDaily);}

/* ---------- 保存 / 载入 ---------- */
function saveToday(){const d=collect();const all=loadReports();all[d.date]=d;saveReports(all);
  toast('已保存 '+d.date+' 的日报 ✓');}
function loadToday(){const all=loadReports();const key=$('rdate').value||todayStr();
  const d=all[key];if(!d){toast('该日期暂无保存记录');return;}
  fillForm(d);toast('已载入 '+key);}
function fillForm(d){
  $('rdate').value=d.date;
  $('r_north').value=d.r_north;$('r_south').value=d.r_south;$('r_mid').value=d.r_mid;
  $('r_big').value=d.r_big;$('r_road').value=d.r_road;$('r_recv').value=d.r_recv;$('r_tea').value=d.r_tea;
  $('proj').value=d.proj||'';
  $('over4_list').innerHTML='';d.over4.forEach(x=>addOver4(x));
  $('svc_list').innerHTML='';d.svc.forEach(x=>addSvc(x));
  recalcTotals();
}
function clearForm(){
  ['r_north','r_south','r_mid','r_big','r_road','r_recv','r_tea'].forEach(id=>$(id).value=0);
  recalcTotals();
  $('proj').value='';$('over4_list').innerHTML='';$('svc_list').innerHTML='';
  toast('表单已清空');}

/* ---------- 周报 ---------- */
function toggleWeek(){const c=$('week_card');c.classList.toggle('hidden');
  if(!c.classList.contains('hidden'))genWeek();}
function mondayOf(offset){const now=new Date();const day=(now.getDay()+6)%7;
  const mon=new Date(now);mon.setDate(now.getDate()-day+offset*7);
  return mon;}
function weekDays(){const mon=mondayOf(weekOffset);const arr=[];
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);
    arr.push(d.toISOString().slice(0,10));}return arr;}
function fmtRange(){const days=weekDays();return `${days[0]} 至 ${days[6]}`;}
function shiftWeek(n){weekOffset+=n;genWeek();}
let lastWeek='';
function genWeek(){
  const days=weekDays();const all=loadReports();
  $('week_range').textContent=fmtRange();
  // 汇总统计
  let totC16=0,totC21=0,daysData=[];
  days.forEach(dt=>{const d=all[dt];if(d){
    totC16+=+d.c16;totC21+=+d.c21;daysData.push({dt,d});}});
  let s=`本周周报（${fmtRange()}）\n`;
  s+=`汇总：16层公区累计接待 ${totC16} 组客户，21层公区累计接待 ${totC21} 组客户；已填报 ${daysData.length} 天。\n`;
  s+=`${'='.repeat(40)}\n\n`;
  if(!daysData.length){s+='（本周尚无保存的日报，请先逐日「保存今日」）';}
  daysData.forEach(({dt,d})=>{s+=genDailyText(d);s+=`\n${'-'.repeat(40)}\n\n`;});
  lastWeek=s;$('week_out').textContent=s;
  // 已保存日期标签
  const tags=days.map(dt=>all[dt]?`<span class="pill">${dt.slice(5)} ✓</span>`:`<span class="pill" style="background:#f0f1f4;color:#9aa4b2;">${dt.slice(5)}</span>`).join('');
  $('week_dates').innerHTML='已保存：'+tags;
}
function copyWeek(){if(!lastWeek)genWeek();
  navigator.clipboard.writeText(lastWeek).then(()=>toast('周报已复制 ✓')).catch(()=>toast('复制失败'));}
function downloadWeek(){if(!lastWeek)genWeek();
  const r=fmtRange().replace(/ /g,'');downloadFile(`周报_${r}.txt`,lastWeek);}

/* ---------- 工具 ---------- */
function downloadFile(name,text){const blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  URL.revokeObjectURL(a.href);toast('已下载 '+name);}

/* ---------- 初始化 ---------- */
(function init(){
  $('rdate').value=todayStr();
  const ph=$('p_hour'),pm=$('p_min');
  for(let i=0;i<24;i++){const o=document.createElement('option');o.value=String(i).padStart(2,'0');o.textContent=o.value;ph.appendChild(o);}
  for(let i=0;i<60;i++){const o=document.createElement('option');o.value=String(i).padStart(2,'0');o.textContent=o.value;pm.appendChild(o);}
  ph.value='20';pm.value='00';
  fillPwd();
  // 默认各加一行，方便直接填
  addOver4();addSvc();
  recalcTotals();
})();
</script>
</body>
</html>
